# KRX fork CI (KRX_FORK_NOTES.md): QuickFIX's own unit and acceptance suites on the platforms
# the KRX gateway builds on. The gateway's checks of these fixes (tests/test_fd_double_close.rs,
# tests/test_partial_send.rs, fix_connection_safety.feature) run in its own CI.
name: KRX fork CI
on:
  push:
    branches: ["krx/**"]
  pull_request:
    branches: ["krx/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Build
        run: |
          # CMake 4 (macOS runners) refuses this tree's cmake_minimum_required below 3.5.
          cmake . -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build . --config ${{ matrix.configuration }} --parallel 4
      - name: Unit tests
        working-directory: ./test
        run: ./ut --quickfix-config-file cfg/ut.cfg --quickfix-spec-path ../spec
      - name: Acceptance tests
        working-directory: ./test
        run: ./runat.sh 6666
      - name: KRX scenarios (docs/V1_BDD_CHECKLIST.md)
        run: ctest --output-on-failure -R krx_ut

  # Rocky Linux 9 (no hosted runner: its container on Ubuntu). The engine, ut and at build with
  # Rocky's own GCC 11, as a gateway build there would; krx_ut needs C++23 <format>, so it builds
  # with gcc-toolset-13 in a second folder.
  test-rocky9:
    runs-on: ubuntu-latest
    container: rockylinux:9
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - name: Install the toolchain
        run: dnf install -y -q gcc-c++ cmake make ruby psmisc gcc-toolset-13-gcc-c++ git
      - uses: actions/checkout@v4
      - name: Build with GCC 11
        run: |
          cmake . -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
          cmake --build . --target ut ut_target at at_target --parallel 4
      - name: Unit tests
        working-directory: ./test
        run: ./ut --quickfix-config-file cfg/ut.cfg --quickfix-spec-path ../spec
      # Not runat.sh: inside a container its `at` outlives the script and holds the step open.
      - name: Acceptance tests
        working-directory: ./test
        timeout-minutes: 30
        run: |
          ./setup.sh 6666
          ./at -f cfg/at.cfg &
          trap 'kill $!' EXIT
          ruby -I. Runner.rb 127.0.0.1 6666 definitions/server/fix4*/*.def definitions/server/fix50/*.def \
            definitions/server/fix50sp1/*.def definitions/server/fix50sp2/*.def definitions/server/validate/*.def
      - name: KRX scenarios (gcc-toolset-13)
        run: |
          source /opt/rh/gcc-toolset-13/enable
          cmake -S . -B build/krx -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DQUICKFIX_EXAMPLES=OFF
          cmake --build build/krx --target krx_ut --parallel 4
          build/krx/src/C++/test/krx/krx_ut

  # Plan item 1.5: the same suites under the sanitizers, GCC on Linux, no suppressions. The first
  # report fails the job. Threaded acceptance runs under ASan only: under TSan it is row 6.3.
  sanitize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    env:
      ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Let TSan map its shadow memory
        if: matrix.sanitizer == 'thread'
        # Ubuntu's default ASLR entropy leaves TSan no room ("unexpected memory mapping").
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Build
        env:
          SANITIZE: ${{ matrix.sanitizer == 'address' && 'address,undefined' || 'thread' }}
        run: |
          flags="-fsanitize=$SANITIZE -fno-sanitize-recover=all -fno-omit-frame-pointer"
          # QUICKFIX_EXAMPLES stays on: it also builds `at`, the acceptance tests' FIX server.
          cmake . -DCMAKE_BUILD_TYPE=Debug -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            "-DCMAKE_CXX_FLAGS=$flags" "-DCMAKE_EXE_LINKER_FLAGS=$flags" "-DCMAKE_SHARED_LINKER_FLAGS=$flags"
          cmake --build . --parallel 4
      - name: Unit tests
        working-directory: ./test
        run: ./ut --quickfix-config-file cfg/ut.cfg --quickfix-spec-path ../spec
      - name: KRX scenarios
        run: ctest --output-on-failure -R krx_ut
      # FIX.4.4 only here (the gateway's version; owner, 11 Nov 2026): the `test` job above runs every
      # version, and runat.sh / runat_threaded.sh run them all under a sanitizer when needed.
      # The runner keeps going when the server is gone ("Connection refused" per test), so fail at
      # once without `at`, and cap each run.
      - name: Acceptance tests (FIX.4.4)
        working-directory: ./test
        timeout-minutes: 30
        run: |
          test -x ./at || { echo "::error::test/at was not built"; exit 1; }
          ./setup.sh 6666
          ./at -f cfg/at.cfg &
          trap 'kill $!' EXIT
          ruby -I. Runner.rb 127.0.0.1 6666 definitions/server/fix44/*.def
      - name: Threaded acceptance tests (FIX.4.4)
        if: matrix.sanitizer == 'address'
        working-directory: ./test
        timeout-minutes: 30
        run: |
          test -x ./at || { echo "::error::test/at was not built"; exit 1; }
          ./setup.sh 6667
          ./at -f cfg/at.cfg -t &
          trap 'kill $!' EXIT
          ruby -I. Runner.rb 127.0.0.1 6667 definitions/server/fix44/*.def
