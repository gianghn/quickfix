# KRX fork CI (KRX_FORK_NOTES.md): QuickFIX's own unit and acceptance suites on the platforms
# the KRX gateway builds on. The gateway's checks of these fixes (tests/test_fd_double_close.rs,
# tests/test_partial_send.rs, fix_connection_safety.feature) run in its own CI.
name: KRX fork CI
on:
  push:
    branches: ["krx/**"]
  pull_request:
    branches: ["krx/**"]
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # 01:00 in Vietnam: the full mutation run and the fuzzing below

jobs:
  test:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Build
        run: |
          # CMake 4 (macOS runners) refuses this tree's cmake_minimum_required below 3.5.
          cmake . -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build . --config ${{ matrix.configuration }} --parallel 4
      - name: Unit tests
        working-directory: ./test
        run: ./ut --quickfix-config-file cfg/ut.cfg --quickfix-spec-path ../spec
      # FIX.4.4 only, the gateway's version (owner, 11 Nov 2026); runat.sh runs every version when
      # they are needed again.
      - name: Acceptance tests (FIX.4.4)
        working-directory: ./test
        timeout-minutes: 30
        run: |
          test -x ./at || { echo "::error::test/at was not built"; exit 1; }
          ./setup.sh 6666
          ./at -f cfg/at.cfg &
          trap 'kill $!' EXIT
          ruby -I. Runner.rb 127.0.0.1 6666 definitions/server/fix44/*.def
      - name: KRX scenarios (docs/V1_BDD_CHECKLIST.md)
        run: ctest --output-on-failure -R krx_ut

  # Rocky Linux 9 (no hosted runner: its container on Ubuntu). The engine, ut and at build with
  # Rocky's own GCC 11, as a gateway build there would; krx_ut needs C++23 <format>, so it builds
  # with gcc-toolset-13 in a second folder.
  test-rocky9:
    runs-on: ubuntu-latest
    container: rockylinux:9
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - name: Install the toolchain
        run: dnf install -y -q gcc-c++ cmake make ruby psmisc gcc-toolset-13-gcc-c++ git
      - uses: actions/checkout@v4
      - name: Build with GCC 11
        run: |
          cmake . -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
          cmake --build . --target ut ut_target at at_target --parallel 4
      - name: Unit tests
        working-directory: ./test
        run: ./ut --quickfix-config-file cfg/ut.cfg --quickfix-spec-path ../spec
      # Not runat.sh: inside a container its `at` outlives the script and holds the step open.
      # FIX.4.4 only, as in the job above.
      - name: Acceptance tests (FIX.4.4)
        working-directory: ./test
        timeout-minutes: 30
        run: |
          ./setup.sh 6666
          ./at -f cfg/at.cfg &
          trap 'kill $!' EXIT
          ruby -I. Runner.rb 127.0.0.1 6666 definitions/server/fix44/*.def
      - name: KRX scenarios (gcc-toolset-13)
        run: |
          source /opt/rh/gcc-toolset-13/enable
          cmake -S . -B build/krx -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DQUICKFIX_EXAMPLES=OFF
          cmake --build build/krx --target krx_ut --parallel 4
          build/krx/src/C++/test/krx/krx_ut

  # Plan item 1.5: the same suites under the sanitizers, GCC on Linux, no suppressions. The first
  # report fails the job. Threaded acceptance runs under both (TSan: row 6.3, since Phase 6).
  sanitize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    env:
      ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Let TSan map its shadow memory
        if: matrix.sanitizer == 'thread'
        # Ubuntu's default ASLR entropy leaves TSan no room ("unexpected memory mapping").
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Build
        env:
          SANITIZE: ${{ matrix.sanitizer == 'address' && 'address,undefined' || 'thread' }}
        run: |
          flags="-fsanitize=$SANITIZE -fno-sanitize-recover=all -fno-omit-frame-pointer"
          # QUICKFIX_EXAMPLES stays on: it also builds `at`, the acceptance tests' FIX server.
          cmake . -DCMAKE_BUILD_TYPE=Debug -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            "-DCMAKE_CXX_FLAGS=$flags" "-DCMAKE_EXE_LINKER_FLAGS=$flags" "-DCMAKE_SHARED_LINKER_FLAGS=$flags"
          cmake --build . --parallel 4
      - name: Unit tests
        working-directory: ./test
        run: ./ut --quickfix-config-file cfg/ut.cfg --quickfix-spec-path ../spec
      - name: KRX scenarios
        run: ctest --output-on-failure -R krx_ut
      # FIX.4.4 only (the gateway's version; owner, 11 Nov 2026), as in every job; runat.sh and
      # runat_threaded.sh run all versions when they are needed again.
      # The runner keeps going when the server is gone ("Connection refused" per test), so fail at
      # once without `at`, and cap each run.
      - name: Acceptance tests (FIX.4.4)
        working-directory: ./test
        timeout-minutes: 30
        run: |
          test -x ./at || { echo "::error::test/at was not built"; exit 1; }
          ./setup.sh 6666
          ./at -f cfg/at.cfg &
          trap 'kill $!' EXIT
          ruby -I. Runner.rb 127.0.0.1 6666 definitions/server/fix44/*.def
      - name: Threaded acceptance tests (FIX.4.4)
        working-directory: ./test
        timeout-minutes: 30
        run: |
          test -x ./at || { echo "::error::test/at was not built"; exit 1; }
          ./setup.sh 6667
          ./at -f cfg/at.cfg -t &
          trap 'kill $!' EXIT
          ruby -I. Runner.rb 127.0.0.1 6667 definitions/server/fix44/*.def

  # Plan item 1.7 (docs/MAINTENANCE.md §5): Mull on the critical files listed in mull.yml. On a PR
  # only the lines it changes there are mutated, and krx_ut and ut together must kill at least 80 %
  # of those mutants; the nightly run mutates every critical line and only reports the scores.
  # Static linking puts in each test binary only the engine code it uses, so Mull reads the mutants
  # from both binaries; test/krx/mutation-tests.sh runs both suites for each mutant either way.
  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      MULL_DEB: Mull-18-0.35.0-LLVM-18.1.3-ubuntu-amd64-24.04.deb
      MULL_SHA256: b18ed37548077035fc14f267e33bb2bf1bb01379825af21d62db5a57d93adfe5
      KRX_BUILD: ${{ github.workspace }}/build/mull
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install clang 18 and Mull 0.35.0 (pinned, checksum checked)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang-18
          curl -sSLf -o mull.deb "https://github.com/mull-project/mull/releases/download/0.35.0/$MULL_DEB"
          echo "$MULL_SHA256  mull.deb" | sha256sum -c -
          sudo apt-get install -y -qq ./mull.deb
      - name: On a PR, mutate only the lines it changes
        if: github.event_name == 'pull_request'
        run: |
          printf 'gitDiffRef: origin/%s\ngitProjectRoot: %s\n' "$GITHUB_BASE_REF" "$PWD" >> mull.yml
      - name: Build with the Mull plugin
        run: |
          CC=clang-18 CXX=clang++-18 cmake -S . -B "$KRX_BUILD" -DCMAKE_BUILD_TYPE=Debug \
            -DQUICKFIX_EXAMPLES=OFF -DQUICKFIX_SHARED_LIBS=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            "-DCMAKE_CXX_FLAGS=-O0 -g -grecord-command-line -fpass-plugin=/usr/lib/mull-ir-frontend-18"
          cmake --build "$KRX_BUILD" --target ut krx_ut --parallel 4
      - name: Mutation testing
        env:
          GATE: ${{ github.event_name == 'pull_request' && '--mutation-score-threshold=80' || '--allow-surviving' }}
        # --timeout above the script's own limits (60 s krx_ut + 120 s ut), so those decide: Mull's
        # default timed out the warm-up once krx_ut passed about 20 s in this -O0 build (#34).
        run: |
          for binary in "$KRX_BUILD/src/C++/test/krx/krx_ut" "$KRX_BUILD/src/C++/test/ut"; do
            mull-runner-18 --workers 4 --timeout 200000 --reporters IDE --reporters GitHubAnnotations \
              "$GATE" --test-program test/krx/mutation-tests.sh "$binary"
          done

  # Plan item 1.7: libFuzzer over FixInput's five modes, 30 minutes a night, ASan on. A crash fails
  # the job and its input is kept as an artifact: it becomes a red scenario, then a corpus file.
  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install clang 18
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang-18 libclang-rt-18-dev
      - name: Build krx_fuzz
        run: |
          flags="-fsanitize=address,fuzzer-no-link -g"
          CC=clang-18 CXX=clang++-18 cmake -S . -B build/fuzz -DCMAKE_BUILD_TYPE=Debug -DKRX_FUZZ=ON \
            -DQUICKFIX_EXAMPLES=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5 "-DCMAKE_CXX_FLAGS=$flags" \
            -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address
          cmake --build build/fuzz --target krx_fuzz --parallel 4
      - name: Fuzz for 30 minutes
        run: |
          mkdir -p fuzz-corpus fuzz-crashes
          build/fuzz/src/C++/test/krx/krx_fuzz -max_total_time=1800 -artifact_prefix=fuzz-crashes/ fuzz-corpus
      - name: Keep the crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: fuzz-crashes/
